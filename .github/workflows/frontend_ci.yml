name: Frontend CI 🎫

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  CI:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_CLIENT_URL: ${{ secrets.NEXT_PUBLIC_CLIENT_URL }}
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: './frontend/.nvmrc'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

      - name: Run build with strict error handling
        run: |
          set -e

          yarn build 2>&1 | tee build.log

          if grep -i "failed\|exception" build.log; then
            echo "❌ Build completed but contains errors!"
            exit 1
          fi

          if grep -E "(TypeError|ReferenceError|SyntaxError)" build.log; then
            echo "❌ JavaScript errors detected during build!"
            exit 1
          fi

          echo "✅ Build completed successfully without errors!"

      - name: Clean up build logs
        if: always()
        run: rm -f build.log
